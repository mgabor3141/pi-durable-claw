name: CI
# `next` is where work lands before `main` moves, so a failure shows there first.
on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and the test suite. The suite builds the workspace image and runs it (test/global-setup.ts): the tests
  # reach it over SSH as the harness does, and the crash test kills a harness mid-script.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile   # the bridge builds on install: it fetches T3 and its web app (network)
      - run: pnpm typecheck
      - run: pnpm test

  # The images as compose runs them. The harness image's build also vets and tests tailnet/ (Go). Then the stack
  # starts: the launcher installs this checkout as the harness, it pairs and makes a folder in the workspace, and on a
  # push the stack restarts pinned to the pushed commit, which the launcher downloads from GitHub and switches to
  # (dev/image-smoke.sh). No model is called.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: dev/image-smoke.sh
        env:
          SMOKE_VERSION: ${{ github.event_name == 'push' && github.sha || '' }}
